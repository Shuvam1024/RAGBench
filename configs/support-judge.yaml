# Two existing support-fixture questions. Extractive answers, one live judge call each.
# Prices are the published gpt-5-nano text rates (USD per 1M tokens) from
# https://developers.openai.com/api/docs/models/gpt-5-nano
# OPENAI_API_KEY comes from the environment. Do not put a key in this file.
schema_version: 1
dataset:
  documents_path: ../datasets/support/documents
  benchmark_path: ../datasets/support/judge-sample.json
retrieval:
  type: bm25
generation:
  provider: extractive
  context_k: 3
judge:
  model: gpt-5-nano
  max_output_tokens: 4096
  timeout_seconds: 120
  pricing:
    input_per_million: 0.05
    cached_input_per_million: 0.005
    output_per_million: 0.40
