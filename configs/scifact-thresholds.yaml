# BM25 on SciFact is deterministic. Any quality movement fails the gate.
# gate_on_ci false is the point_drop policy, the same family as configs/thresholds.yaml.
max_drop:
  mrr: 0.0
  map: 0.0
  recall@10: 0.0
  recall@100: 0.0
  ndcg@10: 0.0
max_increase_ratio: {}
statistics:
  seed: 0
  bootstrap_samples: 10000
  permutation_samples: 10000
  confidence: 0.95
  gate_on_ci: false
