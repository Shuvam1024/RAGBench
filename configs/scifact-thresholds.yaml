# Frozen SciFact BM25 is deterministic. Any quality movement fails the gate.
# CI scores configs/scifact-bm25-document.yaml and
# configs/scifact-bm25-selected.yaml against their committed reports.
# The exploratory whitespace chunk-120 config is not this gate.
# gate_on_ci false is the point_drop policy, the same family as configs/thresholds.yaml.
max_drop:
  mrr: 0.0
  map: 0.0
  recall@10: 0.0
  recall@100: 0.0
  ndcg@10: 0.0
max_increase_ratio: {}
statistics:
  seed: 0
  bootstrap_samples: 10000
  permutation_samples: 10000
  confidence: 0.95
  gate_on_ci: false
