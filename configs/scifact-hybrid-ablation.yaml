# Exploratory dense_weight and fusion sweep on the SciFact test split.
# The committed result is benchmarks/scifact/ablation-hybrid.json, including
# dense_weight 0.75. That weight was chosen while looking at the test split
# and is not the frozen setting. Train selection of the weight is
# configs/scifact-hybrid-train-sweep.yaml. dense_weight is ignored for RRF.
schema_version: 1
base: scifact-hybrid.yaml
axes:
  - name: dense_weight
    field: retrieval.dense_weight
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
  - name: fusion
    field: retrieval.fusion
    values: [minmax, rrf]
