# Dense weight and fusion around the SciFact hybrid configuration.
# dense_weight is ignored when fusion is rrf.
schema_version: 1
base: scifact-hybrid.yaml
axes:
  - name: dense_weight
    field: retrieval.dense_weight
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
  - name: fusion
    field: retrieval.fusion
    values: [minmax, rrf]
