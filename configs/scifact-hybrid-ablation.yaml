# Train-split sensitivity for dense_weight and fusion. The weight used in the
# held-out test report is chosen by configs/scifact-hybrid-train-sweep.yaml.
# dense_weight is ignored when fusion is rrf.
schema_version: 1
base: scifact-hybrid-train.yaml
axes:
  - name: dense_weight
    field: retrieval.dense_weight
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
  - name: fusion
    field: retrieval.fusion
    values: [minmax, rrf]
