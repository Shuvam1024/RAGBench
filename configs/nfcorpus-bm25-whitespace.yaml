# NFCorpus test split with the original SciFact chunked BM25 definition.
# Whitespace tokenizer, 120-word windows, overlap 20, k1 1.5, b 0.75.
# Same field as the other BM25 configs (title and body joined by a newline).
# Not used to choose settings. Not a Pyserini BEIR reproduction.
schema_version: 1
dataset:
  documents_path: ../.cache/beir/nfcorpus
  benchmark_path: ../.cache/beir/nfcorpus/benchmark.json
chunking:
  chunk_size: 120
  overlap: 20
retrieval:
  type: bm25
  k1: 1.5
  b: 0.75
evaluation:
  recall_at_k: [10, 100]
  ndcg_at_k: [10]
  precision_at_k: [10]
  stored_hits: 10
output:
  json_path: null
