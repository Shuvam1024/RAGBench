# Train-selected chunked BM25, frozen for the SciFact test split.
# Chosen on the 809-query train split by scripts/select_scifact_train.py:
# maximum train nDCG@10, then smaller chunk size, then whitespace before stem.
# Winner: stem, 480-word windows, overlap 20, k1 1.5, b 0.75.
# Indexed field: prepared title and body joined by one newline. rank_bm25
# BM25Okapi. Tokenizer: \w+ after casefold, vendored NLTK English stopwords,
# Snowball English stemmer. Not Lucene and not Pyserini BEIR BM25.
# Do not edit this file after the test report is written.
schema_version: 1
dataset:
  documents_path: ../.cache/beir/scifact
  benchmark_path: ../.cache/beir/scifact/benchmark.json
chunking:
  unit: words
  chunk_size: 480
  overlap: 20
retrieval:
  type: bm25
  k1: 1.5
  b: 0.75
  tokenizer: stem
evaluation:
  recall_at_k: [10, 100]
  ndcg_at_k: [10]
  precision_at_k: [10]
  stored_hits: 10
output:
  json_path: null
