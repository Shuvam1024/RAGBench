# SciFact train split, used only to choose settings. Report held-out numbers
# from configs/scifact-bm25.yaml. Prepare the split first:
#   ragbench dataset scifact --split train --cache .cache/beir
schema_version: 1
dataset:
  documents_path: ../.cache/beir/scifact
  benchmark_path: ../.cache/beir/scifact/benchmark.train.json
chunking:
  chunk_size: 120
  overlap: 20
retrieval:
  type: bm25
  k1: 1.5
  b: 0.75
  tokenizer: stem
evaluation:
  recall_at_k: [10, 100]
  ndcg_at_k: [10]
  precision_at_k: [10]
  stored_hits: 10
output:
  json_path: null
