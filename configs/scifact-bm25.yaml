# Original chunked BM25 on the SciFact test split. Tokenizer is the default
# whitespace \w+ split. Windows are 120 words with overlap 20. k1=1.5, b=0.75.
# Indexed field: prepared title and body joined by one newline.
# This is a RAG-style chunked index. It is not Pyserini BEIR BM25 and is not
# the train-selected system. CI compares this file with benchmarks/scifact/bm25.json.
# Prepare the corpus first:
#   ragbench dataset scifact --cache .cache/beir
schema_version: 1
dataset:
  documents_path: ../.cache/beir/scifact
  benchmark_path: ../.cache/beir/scifact/benchmark.json
chunking:
  chunk_size: 120
  overlap: 20
retrieval:
  type: bm25
  k1: 1.5
  b: 0.75
evaluation:
  recall_at_k: [10, 100]
  ndcg_at_k: [10]
  precision_at_k: [10]
  stored_hits: 10
output:
  json_path: null
