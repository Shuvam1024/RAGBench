# Train-split cross-encoder grid. Do not point this file at the test split.
# The first stage is the frozen hybrid: stem, 480-word windows, overlap 20,
# k1 1.5, b 0.75, min-max, dense_weight 0.5. It is not retuned here.
# scripts/select_scifact_rerank.py scores candidate depths 20, 50, and 100
# from one pass over this file's candidate_k. The highest train nDCG@10 wins.
# A tie prefers the smaller depth. The test split is scored only after that
# choice is committed.
# The cross-encoder sees the highest-scoring first-stage chunk of each
# document. Pairs longer than 512 tokens, including special tokens, are
# truncated. The score is the raw logit (identity activation).
schema_version: 1
dataset:
  documents_path: ../.cache/beir/scifact
  benchmark_path: ../.cache/beir/scifact/benchmark.train.json
chunking:
  unit: words
  chunk_size: 480
  overlap: 20
retrieval:
  type: hybrid
  fusion: minmax
  dense_weight: 0.5
  rrf_k: 60
  bm25:
    type: bm25
    k1: 1.5
    b: 0.75
    tokenizer: stem
  dense:
    type: dense
    model_name: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41
    device: cpu
    batch_size: 32
rerank:
  model_name: cross-encoder/ms-marco-MiniLM-L-6-v2
  revision: 233902d25c440f23af6f7d6e94d2946bac0bee0a
  candidate_k: 100
  max_length: 512
  batch_size: 32
  device: cpu
  text: best_first_stage_chunk
evaluation:
  recall_at_k: [10, 100]
  ndcg_at_k: [10]
  precision_at_k: [10]
  stored_hits: 10
output:
  json_path: null
