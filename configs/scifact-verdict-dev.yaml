# SciFact dev claims. The policy was frozen on train. Do not retune this file.
# Winner: benchmarks/scifact/verdict-train-selection.json
# doc_k 1, sentence_k 2, min_confidence 0.7 had the highest train macro-F1.
# sentence_k 1 tied that macro-F1; sentence_k 2 won on mean sentence F1.
# Retrieval is the frozen document-level BM25 index (stem, k1 0.9, b 0.4).
# It is not retuned. The NLI model was not fine-tuned on SciFact.
# The public test file is not scored. Its labels are withheld.
schema_version: 1
claims_cache: ../.cache/scifact
documents_path: ../.cache/beir/scifact
beir_raw: ../.cache/beir/scifact/raw/scifact
split: dev
retrieval:
  type: bm25
  k1: 0.9
  b: 0.4
  tokenizer: stem
  unit: document
nli:
  model_name: cross-encoder/nli-MiniLM2-L6-H768
  revision: b95119ce93d3e065de6214e38cd4a97b0f2f2c6d
  max_length: 512
  batch_size: 32
  device: cpu
grid:
  doc_k: [1, 3]
  sentence_k: [1, 2]
  min_confidence: [0.5, 0.7]
policy:
  doc_k: 1
  sentence_k: 2
  min_confidence: 0.7
baseline_verdict: SUPPORT
