# Absolute drops on [0,1] metrics; 0.02 means two percentage points.
# gate_on_ci false is the point_drop policy. A 0.07 drop fails this file.
max_drop:
  mrr: 0.02
  recall@1: 0.02
  recall@3: 0.02
# Timing gates are opt-in because shared CI runners vary in load.
max_increase_ratio: {}
statistics:
  seed: 0
  bootstrap_samples: 10000
  permutation_samples: 10000
  confidence: 0.95
  gate_on_ci: false
