# Choose dense_weight on the SciFact train split after the BM25 grid.
# Winner: maximum train nDCG@10. Ties prefer the smaller dense_weight.
# The base value is skipped, so 0.5 is the "base" row. Do not read the test split.
schema_version: 1
base: scifact-hybrid-train.yaml
axes:
  - name: dense_weight
    field: retrieval.dense_weight
    values: [0.0, 0.25, 0.5, 0.75, 1.0]
