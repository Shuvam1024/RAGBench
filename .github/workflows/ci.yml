name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev --extra api
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q --cov=ragbench --cov-report=term-missing --cov-fail-under=85
      - name: Evaluate candidate
        run: uv run ragbench evaluate --config configs/baseline.yaml --output results/candidate.json
      - name: Enforce quality thresholds
        run: uv run ragbench compare --baseline benchmarks/baseline.json --candidate results/candidate.json --thresholds configs/thresholds.yaml --output results/comparison.json
      - name: Prepare SciFact and enforce the BM25 gate
        run: |
          uv run ragbench dataset scifact --cache .cache/beir
          uv run ragbench evaluate --config configs/scifact-bm25.yaml --output results/scifact-bm25.json
          uv run ragbench compare --baseline benchmarks/scifact/bm25.json --candidate results/scifact-bm25.json --thresholds configs/scifact-thresholds.yaml --output results/scifact-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.os }}
          path: results/*.json
  gate-negative-control:
    name: Negative control gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Expect the support-fixture gate to reject a 0.07 drop
        run: uv run python scripts/demonstrate_gate_failure.py
  dense:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HOME: /home/runner/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/huggingface
          key: minilm-${{ runner.os }}-${{ hashFiles('configs/dense.yaml', 'configs/scifact-rerank-train.yaml') }}
      - run: uv sync --frozen --python 3.12 --extra dev --extra dense
      - run: uv run pytest -q tests/test_dense.py tests/test_integration.py --run-integration
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ragbench-test .
      - run: docker run --rm ragbench-test
